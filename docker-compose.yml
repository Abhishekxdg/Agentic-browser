services:
  agent-browser:
    build: .
    ports:
      - "3001:3001"
    environment:
      - AGENT_BROWSER_API_KEY=${AGENT_BROWSER_API_KEY:-dev-key}
      - HEADLESS=true
      - EXTENSION_PATH=/app/extension   # pre-installed, auto-loads on every session
      # Set EXTENSION_DISABLED=true to launch without extension
    restart: unless-stopped
