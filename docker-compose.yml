services:
  sound-browser:
    build: .
    ports:
      - "3001:3001"
    environment:
      - SOUND_BROWSER_API_KEY=${SOUND_BROWSER_API_KEY:?Set SOUND_BROWSER_API_KEY before starting the service}
      - HEADLESS=true
      - EXTENSION_PATH=/app/extension   # pre-installed, auto-loads on every session
      # Set EXTENSION_DISABLED=true to launch without extension
    restart: unless-stopped
