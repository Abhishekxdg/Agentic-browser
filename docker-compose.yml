services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: sound_browser
      POSTGRES_USER: sound
      POSTGRES_PASSWORD: sound
    ports:
      - "5432:5432"
    volumes:
      - sound-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sound -d sound_browser"]
      interval: 5s
      timeout: 5s
      retries: 10

  sound-browser:
    build: .
    ports:
      - "3001:3001"
    environment:
      - SOUND_BROWSER_API_KEY=${SOUND_BROWSER_API_KEY:?Set SOUND_BROWSER_API_KEY before starting the service}
      - HEADLESS=true
      - EXTENSION_PATH=/app/extension   # pre-installed, auto-loads on every session
      # Set EXTENSION_DISABLED=true to launch without extension
    restart: unless-stopped

volumes:
  sound-postgres:
