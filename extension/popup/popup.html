<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e5e5e5; width: 260px; padding: 14px; }
    .title { font-weight: 700; font-size: 15px; margin-bottom: 12px; }
    .title span { color: #3b82f6; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1a1a1a; }
    .row:last-child { border: none; }
    .label { font-size: 12px; color: #888; }
    .value { font-size: 12px; font-weight: 500; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
    .dot.on { background: #22c55e; }
    .dot.off { background: #ef4444; }
    .btn { margin-top: 12px; width: 100%; padding: 8px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .btn:hover { background: #2563eb; }
    .btn-outline { background: transparent; border: 1px solid #333; color: #ccc; margin-top: 6px; }
    .btn-outline:hover { background: #1a1a1a; }
  </style>
</head>
<body>
  <div class="title">Agent<span>Browser</span></div>
  <div class="row">
    <span class="label">Server</span>
    <span class="value" id="server-status"><span class="dot off"></span>Disconnected</span>
  </div>
  <div class="row">
    <span class="label">Recording</span>
    <span class="value" id="rec-status">Off</span>
  </div>
  <div class="row">
    <span class="label">Captured</span>
    <span class="value" id="cap-count">0 requests</span>
  </div>
  <button class="btn" onclick="openSidePanel()">Open Side Panel</button>
  <button class="btn btn-outline" onclick="toggleRec()" id="rec-btn">⏺ Start Recording</button>
  <script src="popup.js"></script>
</body>
</html>
