<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .logo { font-weight: 700; font-size: 14px; color: #fff; letter-spacing: -0.3px; }
    .logo span { color: #3b82f6; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0; margin-left: auto;
    }
    .status-dot.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e80; }
    .status-dot.disconnected { background: #ef4444; }

    .status-label { font-size: 11px; color: #666; }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #1a1a1a;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #555;
      margin-bottom: 8px;
    }

    .current-page {
      background: #161616;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 8px 10px;
    }

    .page-title { font-weight: 500; color: #e5e5e5; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-url { font-size: 11px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 500;
      border: none; cursor: pointer; transition: all 0.15s; width: 100%;
    }

    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-record { background: #1a1a1a; color: #e5e5e5; border: 1px solid #333; }
    .btn-record.active { background: #7f1d1d; color: #fca5a5; border-color: #991b1b; }
    .btn-record.active:hover { background: #991b1b; }
    .btn-record:hover:not(.active) { background: #222; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
    .btn-danger:hover { background: #991b1b; }

    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }

    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; border-radius: 9px;
      font-size: 10px; font-weight: 600; padding: 0 5px;
    }
    .badge-red { background: #7f1d1d; color: #fca5a5; }
    .badge-blue { background: #1e3a5f; color: #93c5fd; }

    .activity-feed {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
    }

    .activity-feed::-webkit-scrollbar { width: 4px; }
    .activity-feed::-webkit-scrollbar-track { background: transparent; }
    .activity-feed::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .activity-item {
      padding: 6px 0;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .activity-item:last-child { border-bottom: none; }

    .activity-icon {
      width: 20px; height: 20px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; flex-shrink: 0; margin-top: 1px;
    }

    .activity-icon.navigate { background: #1e3a5f; color: #93c5fd; }
    .activity-icon.click { background: #1a2e1a; color: #86efac; }
    .activity-icon.fill { background: #2a1a2e; color: #d8b4fe; }
    .activity-icon.record { background: #2e1a1a; color: #fca5a5; }
    .activity-icon.network { background: #2a2a1a; color: #fde68a; }
    .activity-icon.agent { background: #1a2a2e; color: #67e8f9; }

    .activity-body { flex: 1; min-width: 0; }
    .activity-main { color: #ccc; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .activity-sub { font-size: 11px; color: #555; margin-top: 1px; }

    .activity-time { font-size: 10px; color: #444; flex-shrink: 0; }

    .recording-banner {
      background: #7f1d1d;
      color: #fca5a5;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      display: none;
    }

    .recording-banner.visible { display: flex; }
    .recording-dot { width: 6px; height: 6px; border-radius: 50%; background: #ef4444; animation: blink 1s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .intent-bar {
      padding: 10px 16px;
      border-top: 1px solid #1a1a1a;
      flex-shrink: 0;
    }

    .intent-input-row {
      display: flex; gap: 6px;
    }

    .intent-input {
      flex: 1;
      background: #161616;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e5e5e5;
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
    }

    .intent-input:focus { border-color: #3b82f6; }
    .intent-input::placeholder { color: #444; }

    .intent-send {
      background: #3b82f6;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      padding: 7px 12px;
      font-size: 12px;
      white-space: nowrap;
    }

    .intent-send:hover { background: #2563eb; }
    .intent-send:disabled { background: #1e3a5f; color: #555; cursor: default; }

    .empty-state {
      text-align: center;
      color: #444;
      padding: 24px 16px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Agent<span>Browser</span></div>
  <span class="status-label" id="status-label">disconnected</span>
  <div class="status-dot disconnected" id="status-dot"></div>
</header>

<div class="recording-banner" id="recording-banner">
  <div class="recording-dot"></div>
  Recording network traffic…
  <span id="capture-count" style="margin-left:auto;font-weight:600;">0 requests</span>
</div>

<div class="section">
  <div class="section-title">Current Page</div>
  <div class="current-page">
    <div class="page-title" id="page-title">—</div>
    <div class="page-url" id="page-url">Navigate to a page</div>
  </div>
</div>

<div class="section">
  <div class="btn-row">
    <button class="btn btn-record" id="record-btn" onclick="toggleRecording()">
      ⏺ Record Workflow
    </button>
    <button class="btn btn-primary" onclick="capturePageNow()" title="Extract semantic page model">
      📋 Capture
    </button>
  </div>
</div>

<div class="section-title" style="padding: 10px 16px 4px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:#555;">
  Activity
</div>

<div class="activity-feed" id="activity-feed">
  <div class="empty-state" id="empty-state">
    Connect to an agent-browser server<br>to see activity here.
  </div>
</div>

<div class="intent-bar">
  <div class="intent-input-row">
    <input class="intent-input" id="intent-input" placeholder="Tell agent what to do…" onkeydown="handleIntentKey(event)" />
    <button class="intent-send" id="intent-send" onclick="sendIntent()">Run</button>
  </div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
